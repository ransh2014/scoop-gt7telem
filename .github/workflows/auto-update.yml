name: Auto-update from GitHub release

# Polls ransh2014/gt7telemtrace for a newer release every 6h and bumps
# this bucket's manifest (version/url/hash) to match -- no manual
# intervention needed for routine releases. Uses the manifest's own
# checkver/autoupdate URL pattern as the source of truth for the asset
# name, so it stays in sync if that ever changes.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check latest release and update manifest if needed
        run: |
          set -e
          latest_tag=$(curl -s https://api.github.com/repos/ransh2014/gt7telemtrace/releases/latest | jq -r .tag_name)
          latest_version="${latest_tag#v}"
          current_version=$(jq -r .version bucket/gt7telem.json)

          if [ "$latest_version" = "$current_version" ] || [ "$latest_version" = "null" ]; then
            echo "Already up to date ($current_version)."
            exit 0
          fi
          echo "Updating $current_version -> $latest_version"

          url="https://github.com/ransh2014/gt7telemtrace/releases/download/${latest_tag}/gt7telem-windows.zip"

          # build-windows.yml runs on the same tag push and attaches this
          # asset to the release -- give it time to land before hashing.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$url")
            if [ "$code" = "200" ]; then break; fi
            echo "asset not ready yet (attempt $i, http $code), waiting 30s..."
            sleep 30
          done

          hash=$(curl -sL "$url" | sha256sum | cut -d' ' -f1)

          jq --arg v "$latest_version" --arg u "$url" --arg h "$hash" \
             '.version = $v | .url = $u | .hash = $h' bucket/gt7telem.json > bucket/gt7telem.json.tmp
          mv bucket/gt7telem.json.tmp bucket/gt7telem.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add bucket/gt7telem.json
          git commit -m "Update to $(jq -r .version bucket/gt7telem.json)"
          git push
